# The offline suite, and only the offline suite.
#
# `make test` and `make lint` need no network, no GitHub account and no project,
# which is what makes them safe to run on every push. Nothing here is granted a
# token and nothing here calls `gh`.
#
# Deliberately absent:
#
#   self-test    creates issues, labels and a project on a live account. It runs
#                against the sandbox (paulcaron16k/agile-test) from a developer's
#                machine, never from CI: CI is the last place that should be
#                writing to a real board, and a private sandbox needs a token
#                with `repo` and `project` scope to reach.
#   check-guide  read-only, but not offline -- it executes the guide's read
#                commands against whichever board the profile in the checkout
#                names, which is the live AGILE board. In CI that would be a
#                token and a live read on every push to verify documentation.
#
# So a green run here means the pure logic is sound. It does not mean the write
# side works; that is what `make self-test` against the sandbox is for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the README claims, with no gaps. README says "3.10 or
        # newer", so 3.10, 3.11, 3.12 and 3.13 all run: **a version nothing tests
        # is a promise nothing keeps**, and that applies to the middle of the
        # range as much as to the floor. This list skipped 3.11 for exactly one
        # reason -- floor-and-newest felt like enough -- which is the same
        # reasoning that let `dt.UTC` (3.11+) reach a file whose shebang finds
        # python3.10, with lint and the whole suite green because both ran on
        # 3.12.
        #
        # 3.10 is `RUNTIME_FLOOR` and `ruff.toml`'s target-version. Adding a
        # version here means adding it to the README too, and dropping one means
        # dropping it from both.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `make venv` rather than a bare pip install: every Python target refuses
      # to run outside .venv, from the Makefile and again from conftest.py, so
      # CI has to build the same environment a developer does.
      #
      # **With the matrix interpreter named.** `make venv` defaults to
      # python3.12, and the runner image has one on PATH, so until #275 every
      # job here built its venv from 3.12 whatever setup-python installed: four
      # green runs of one interpreter, and the floor never tested.
      - run: make venv PYTHON=python${{ matrix.python-version }}

      # And then checked, because the failure above was silent: the job names
      # an interpreter and nothing compared it with the one that ran.
      - name: The suite runs on the matrix interpreter
        run: |
          .venv/bin/python -c "
          import sys
          want, have = '${{ matrix.python-version }}', '%d.%d' % sys.version_info[:2]
          print('suite runs on', sys.version.split()[0])
          sys.exit(0 if have == want else f'.venv is {have}, the matrix says {want}')
          "

      - run: make lint

      - run: make test
